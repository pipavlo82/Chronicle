name: Chronicle MVP Demo

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  chronicle-mvp-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found; skipping dependency install"
          fi

      - name: Run complete Node test suite
        run: node --test tests/*.test.mjs

      - name: Run Chronicle MVP demo
        run: node scripts/run_chronicle_mvp_demo.mjs
